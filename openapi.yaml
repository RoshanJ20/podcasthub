      operationId: getAnalytics
      summary: Analytics dashboard aggregates
      description: |
        Requires role `admin` or `superadmin`. Returns a **flat** (unwrapped)
        object of counts and aggregates. Supports optional `from`/`to` ISO
        date-range filters applied to `createdAt` on the underlying activity rows.
      parameters:
        - in: query
          name: from
          schema:
            type: string
            format: date-time
          description: Inclusive range start (ISO-8601).
        - in: query
          name: to
          schema:
            type: string
            format: date-time
          description: Inclusive range end (ISO-8601).
      responses:
        '200':
          description: Analytics summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAnalytics'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/blob-sweep:
    post:
      tags:
        - Admin
      operationId: runBlobSweep
      summary: Orphaned Azure blob sweep (superadmin only)
      description: |
        Requires role `superadmin`. Lists every blob in the configured Azure
        container, diffs against the set of blob keys referenced by
        `AuditBrief`, `LearningGraph`, and `Episode` rows, and returns the
        orphan set. With `?dry-run=false` the orphans are deleted. Always
        writes an audit-log row (`action: blob_sweep`, `entityType: blob_storage`).
      parameters:
        - in: query
          name: dry-run
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
            default: 'true'
          description: Pass `false` to actually delete orphans. Any other value (including omission) is treated as dry-run.
      responses:
        '200':
          description: Sweep results.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BlobSweepResult'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/upload:
    post:
      tags:
        - Upload
      operationId: createPresignedUpload
      summary: Generate a presigned Azure Blob Storage upload URL
      description: >
        Requires role `admin` or `superadmin`. Returns a short-lived (1 hour)

        write-only SAS URL that the client can PUT the file to directly.


        **Limits applied server-side:**

        - `audio` — allowed MIME types: `audio/mpeg`, `audio/wav`, `audio/mp4`, `audio/ogg`, `audio/webm`,
        `audio/x-m4a`, `audio/aac`, `audio/flac`; max 500 MB.

        - `image` — allowed MIME types: `image/jpeg`, `image/png`, `image/webp`, `image/gif`; max 5 MB.

        - `pdf`   — allowed MIME types: `application/pdf`; max 50 MB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresignedUploadRequest'
            example:
              filename: q1-bulletin.pdf
              content_type: application/pdf
              file_size: 1048576
              category: pdf
      responses:
        '200':
          description: Presigned SAS URL, blob key, and container name.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PresignedUploadResponse'
              example:
                data:
                  upload_url: https://...blob.core.windows.net/the-audit-brief-uploads/pdf/UUID/q1-bulletin.pdf?sv=...&sig=...
                  key: pdf/3f2e7a6d-4b1a-4f9d-8a77-1b4c8e6d2a10/q1-bulletin.pdf
                  container: the-audit-brief-uploads
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/upload/file:
    post:
      tags:
        - Upload
      operationId: uploadFileDirect
      summary: Server-side file upload (multipart)
      description: |
        Requires role `admin` or `superadmin`. Streams the file body into Azure
        Blob Storage server-side to avoid CORS and to work around the 10 MB
        edge-buffer cap on the Next.js middleware (this route is explicitly
        excluded from the middleware matcher — it authenticates itself).

        Applies the same MIME and size limits as `/api/upload`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DirectUploadFormData'
            encoding:
              file:
                contentType: >-
                  audio/mpeg, audio/wav, audio/mp4, audio/ogg, audio/webm, audio/x-m4a, audio/aac, audio/flac,
                  image/jpeg, image/png, image/webp, image/gif, application/pdf
      responses:
        '200':
          description: File stored. Returns the generated blob key.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      key:
                        type: string
                        example: audio/UUID/lecture.mp3
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/media:
    get:
      tags:
        - Media
      operationId: streamMediaByKey
      summary: Stream a stored blob by key (supports Range requests)
      description: |
        Public. Streams bytes directly from Azure Blob Storage so large audio
        files are never buffered server-side. Responds `206 Partial Content`
        when a `Range` request header is present, otherwise `200 OK`.

        **Security note:** this endpoint is unauthenticated and accepts any
        well-formed blob key. Pen-testers should treat it as an enumeration
        surface (guessing UUIDs, directory traversal attempts, path injection).
      security: []
      parameters:
        - in: query
          name: key
          required: true
          schema:
            type: string
            minLength: 1
          description: Blob key (e.g. `audio/UUID/lecture.mp3`).
        - in: header
          name: Range
          required: false
          schema:
            type: string
            example: bytes=0-1048575
          description: Standard HTTP range header; forwarded to Azure.
      responses:
        '200':
          description: Full content (no Range requested).
          headers:
            Content-Type:
              schema:
                type: string
              description: Inferred from blob extension (see `MIME_MAP`).
            Content-Length:
              schema:
                type: integer
            Accept-Ranges:
              schema:
                type: string
                example: bytes
            Cache-Control:
              schema:
                type: string
                example: public, max-age=3600
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '206':
          description: Partial content (Range requested).
          headers:
            Content-Type:
              schema:
                type: string
            Content-Length:
              schema:
                type: integer
            Content-Range:
              schema:
                type: string
                example: bytes 0-1048575/52428800
            Accept-Ranges:
              schema:
                type: string
                example: bytes
            Cache-Control:
              schema:
                type: string
                example: public, max-age=3600
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: next-auth.session-token
      description: |
        NextAuth v4 JWT session cookie. `httpOnly`, `SameSite=Lax`, and `Secure`
        in production. Over HTTPS the cookie is named
        `__Secure-next-auth.session-token`.

        Issued by `POST /api/auth/callback/credentials` (dev) or the Azure AD
        OAuth flow (`GET /api/auth/signin/azure-ad` → provider → `GET /api/auth/callback/azure-ad`).
        Contains a signed JWT with `userId`, `role`, `email`, and `jti` (for
        server-side revocation).
  headers:
    ContentSecurityPolicy:
      description: >-
        Per-request, nonce-based Content Security Policy emitted by `middleware.ts`. Exactly one of these headers MUST
        appear on every response — duplicate CSP headers would intersect and drop the nonce. The nonce token is
        regenerated on every request and is a 22-character base64 value.
      schema:
        type: string
        example: >-
          default-src 'self'; script-src 'self' 'nonce-NTBlOGEzNjJiNTNlNDNkNDg5OTI5MmMxMTFlYjE0YjY' 'strict-dynamic';
          style-src 'self' 'nonce-NTBlOGEzNjJiNTNlNDNkNDg5OTI5MmMxMTFlYjE0YjY'; style-src-attr 'unsafe-inline'; img-src
          'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self'
          blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none';
          upgrade-insecure-requests
    StrictTransportSecurity:
      description: HSTS pin set by both `next.config.ts` and the nginx server block.
      schema:
        type: string
        example: max-age=31536000; includeSubDomains; preload
    XFrameOptions:
      description: >-
        Clickjacking protection. Next.js sets `DENY` (most restrictive); nginx sets `SAMEORIGIN`. Browsers honour the
        first value seen.
      schema:
        type: string
        enum:
          - DENY
          - SAMEORIGIN
        example: DENY
    XContentTypeOptions:
      description: Prevents MIME sniffing.
      schema:
        type: string
        enum:
          - nosniff
        example: nosniff
    ReferrerPolicy:
      description: Referrer leakage policy.
      schema:
        type: string
        example: strict-origin-when-cross-origin
    PermissionsPolicy:
      description: Browser feature gating set by `next.config.ts`. Camera, microphone, and geolocation are explicitly disabled.
      schema:
        type: string
        example: camera=(), microphone=(), geolocation=()
    XXSSProtection:
      description: Legacy XSS auditor explicitly disabled (`0`) per OWASP guidance — the modern CSP is the actual defence.
      schema:
        type: string
        enum:
          - '0'
        example: '0'
    CacheControl:
      description: >-
        VAPT-mandated no-cache for HTML/JSON responses. Nginx applies this to every response on the HTTPS server block.
        Static assets under `/_next/static/*` may override with `public, max-age=31536000, immutable`.
      schema:
        type: string
        example: no-store, no-cache, must-revalidate, proxy-revalidate
    Pragma:
      description: Legacy HTTP/1.0 no-cache directive.
      schema:
        type: string
        enum:
          - no-cache
        example: no-cache
    Expires:
      description: Legacy HTTP/1.0 cache expiry. Always `0` — never cache.
      schema:
        type: string
        example: '0'
    XRequestId:
      description: >-
        Per-request UUID v4 correlation ID generated in `middleware.ts`. Echoed in the `request_id` field of every
        `ErrorResponse` for log correlation across the stack (browser → nginx access log → pm2 stdout → Sentry).
      schema:
        type: string
        format: uuid
        example: 3f2e7a6d-4b1a-4f9d-8a77-1b4c8e6d2a10
  parameters:
    IdPathParam:
      in: path
      name: id
      required: true
      description: Canonical UUID (8-4-4-4-12 hex).
      schema:
        type: string
        format: uuid
      example: 3f2e7a6d-4b1a-4f9d-8a77-1b4c8e6d2a10
    PageParam:
      in: query
      name: page
      schema:
        type: integer
        minimum: 1
        default: 1
      description: 1-based page index.
    LimitParam:
      in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Page size (max 100).
  responses:
    BadRequest:
      description: Malformed request, missing required fields, or invalid values.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 400
            error_code: BAD_REQUEST
            message: key parameter required
            request_id: 3f2e7a6d-4b1a-4f9d-8a77-1b4c8e6d2a10
    UnauthorizedError:
      description: No session cookie or the session has expired / been revoked.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 401
            error_code: UNAUTHORIZED
            message: Authentication required
            request_id: 3f2e7a6d-4b1a-4f9d-8a77-1b4c8e6d2a10
    ForbiddenError:
      description: Authenticated but lacks the required role (or does not own the resource).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 403
            error_code: FORBIDDEN
            message: Insufficient role
    NotFoundError:
      description: Resource does not exist (or is archived where archived rows are hidden).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 404
            error_code: NOT_FOUND
            message: AuditBrief not found
    ConflictError:
      description: Optimistic-concurrency conflict — the client's `expectedUpdatedAt` is stale.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 409
            error_code: CONFLICT
            message: Resource has been modified since you loaded it. Please refresh and try again.
    ValidationError:
      description: Request body failed Zod validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 422
            error_code: VALIDATION_FAILED
            message: Validation failed
            details:
              - path:
                  - password
                message: Password must be at least 12 characters
                code: too_small
    RateLimitedError:
      description: Too many requests (reserved — rate limiting is not currently wired into any route).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Unhandled server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 500
            error_code: INTERNAL_ERROR
            message: Internal server error
  schemas:
    ErrorResponse:
      type: object
      required:
        - status
        - error_code
        - message
      properties:
        status:
          type: integer
          description: HTTP status code.
          example: 422
        error_code:
          type: string
          enum:
            - BAD_REQUEST
            - UNAUTHORIZED
            - FORBIDDEN
            - NOT_FOUND
            - CONFLICT
            - VALIDATION_FAILED
            - RATE_LIMITED
            - INTERNAL_ERROR
          description: Machine-readable error classification.
        message:
          type: string
          description: Human-readable message. Safe to surface to end-users.
        details:
          description: |
            Free-form diagnostic detail. For `VALIDATION_FAILED` this is a Zod
            `issues` array; for other codes it is commonly absent. May be null.
        request_id:
          type: string
          format: uuid
          description: Echo of the `x-request-id` header — use for log correlation.
    PaginatedEnvelope:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items: {}
        pagination:
          type: object
          required:
            - page
            - limit
            - total
            - total_pages
          properties:
            page:
              type: integer
              minimum: 1
              example: 1
            limit:
              type: integer
              minimum: 1
              maximum: 100
              example: 20
            total:
              type: integer
              minimum: 0
              example: 137
            total_pages:
              type: integer
              minimum: 0
              example: 7
    Domain:
      type: string
      description: Deduplicated union of podcast and learning-series knowledge domains.
      enum:
        - Audit Methodology
        - Accounting and Reporting
        - Audit Technology
        - Quality and Risk
        - LEAP
        - Auditing
    Role:
      type: string
      enum:
        - public
        - admin
        - superadmin
    UploadCategory:
      type: string
      enum:
        - audio
        - image
        - pdf
    PathType:
      type: string
      enum:
        - linear
        - graph
    TranscriptType:
      type: string
      enum:
        - short
        - long
    ActivityType:
      type: string
      enum:
        - listen
        - bookmark
        - unbookmark
        - complete_episode
        - view_audit_brief
        - view_path
        - search
        - favorite
        - unfavorite
        - signin
        - signout
        - signin_failed
    NextAuthSession:
      type: object
      description: Response of `GET /api/auth/session` when signed in.
      properties:
        user:
          type: object
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
              format: email
            name:
              type: string
              nullable: true
            image:
              type: string
              nullable: true
            role:
              $ref: '#/components/schemas/Role'
        expires:
          type: string
          format: date-time
    NextAuthCsrfToken:
      type: object
      description: Response of `GET /api/auth/csrf`.
      properties:
        csrfToken:
          type: string
    NextAuthProviders:
      type: object
      description: Response of `GET /api/auth/providers`.
      additionalProperties: true
    ReadyResponse:
      type: object
      required:
        - status
        - timestamp
        - checks
      properties:
        status:
          type: string
          enum:
            - ready
            - not_ready
        timestamp:
          type: string
          format: date-time
        checks:
          type: object
          required:
            - database
          properties:
            database:
              type: string
              enum:
                - ok
                - failed
    RegisterRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
          description: |
            OWASP-compliant: minimum 12 characters, must contain at least one
            uppercase letter, one lowercase letter, one digit, and one
            non-alphanumeric character. Login uses a relaxed 1+ char check.
          example: Str0ng!Pass1234
        displayName:
          type: string
          minLength: 1
          maxLength: 100
          nullable: true
    RegisteredUser:
      type: object
      required:
        - id
        - email
        - role
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
          nullable: true
        role:
          $ref: '#/components/schemas/Role'
        createdAt:
          type: string
          format: date-time
    CreateAuditBriefRequest:
