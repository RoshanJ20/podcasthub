openapi: 3.0.3
info:
  title: The Audit Brief API
  version: 0.2.1
  description: >
    Internal enterprise audio platform for audit professionals.


    Authoritative machine-readable contract for every `/api/*` endpoint exposed by

    **The Audit Brief** (internal brand name: *podcasthub*). Intended for:


    - **Security testing (VAPT)** — every endpoint, every role boundary, every
      request/response shape, and every response security header documented so
      tools such as Burp Suite, OWASP ZAP, Postman, and Schemathesis can drive
      targeted fuzzing and policy checks.
    - **Integration work** — new clients can be generated from this spec.

    - **Internal reference** — keeps documentation in lock-step with the Zod
      schemas in `lib/schemas/` and the Prisma entities in `prisma/schema.prisma`.

    ## Base URL


    All paths below are relative to the Next.js `basePath`. The effective URL a

    client hits is:

        https://uat.uno.wcgt.in/auditbrief/api/<path>

    ## Authentication


    Sessions are established via **NextAuth v4** and carried in an httpOnly cookie

    named `next-auth.session-token` (or `__Secure-next-auth.session-token` over

    HTTPS). The cookie is a signed JWT containing `userId`, `role`, `email`, and a

    `jti` used for server-side revocation.


    The default security requirement for every operation is `cookieAuth`. Public

    endpoints explicitly override this with `security: []`.


    ## Authorization model


    | Role         | Capabilities                                                           |

    |--------------|------------------------------------------------------------------------|

    | `public`     | Read public content, manage own bookmarks/favorites/progress/activity  |

    | `admin`      | All `public` + create/update/delete audit briefs, learning graphs, uploads |

    | `superadmin` | All `admin` + manage users, run blob-sweep                             |


    Role requirements are noted in the `description` of each operation.


    ## Error envelope


    All errors share a single JSON shape (`ErrorResponse`):


    ```json

    {
      "status": 422,
      "error_code": "VALIDATION_FAILED",
      "message": "Validation failed",
      "details": [ /* Zod issues */ ],
      "request_id": "3f2e7a6d-..."
    }

    ```


    The `request_id` header (`x-request-id`) is echoed on every response for log

    correlation.


    ## Response security headers (applies to every response)


    Every response from the application is wrapped in a layered set of security

    headers. The list below is the **production contract** — VAPT scans should

    verify each is present and correctly valued on a representative sample of

    endpoints. Headers come from three sources: Next.js `middleware.ts` (per

    request), `next.config.ts` (static), and nginx (server block + per-location

    override for `/auditbrief`). The merged effective set seen by the browser is:


    | Header                         | Source            | Value
    (production)                                                   |

    |--------------------------------|-------------------|----------------------------------------------------------------------|

    | `Content-Security-Policy`      | `middleware.ts`   | Per-request, nonce-based (see below). Single header — never
    duplicated. |

    | `Strict-Transport-Security`    | `next.config.ts` + nginx | `max-age=31536000; includeSubDomains;
    preload`                |

    | `X-Frame-Options`              | nginx + Next.js   | `SAMEORIGIN` (nginx) — `DENY` (Next.js, applied
    first)              |

    | `X-Content-Type-Options`       | nginx + Next.js   |
    `nosniff`                                                            |

    | `Referrer-Policy`              | nginx + Next.js   |
    `strict-origin-when-cross-origin`                                    |

    | `Permissions-Policy`           | `next.config.ts`  | `camera=(), microphone=(),
    geolocation=()`                           |

    | `X-XSS-Protection`             | `next.config.ts`  | `0` (legacy filter explicitly disabled per OWASP
    guidance)           |

    | `Cache-Control`                | nginx             | `no-store, no-cache, must-revalidate,
    proxy-revalidate`              |

    | `Pragma`                       | nginx             |
    `no-cache`                                                           |

    | `Expires`                      | nginx             |
    `0`                                                                  |

    | `x-request-id`                 | `middleware.ts`   | UUID v4 — echoed in every error envelope's `request_id`
    field.       |


    ### Content-Security-Policy details


    The CSP is generated **per response** by `lib/security/csp.ts`

    (`buildContentSecurityPolicy(nonce)`). The nonce is a 22-character

    base64 string from a cryptographically-random UUID, regenerated on every

    request in `middleware.ts`. Effective directives:


    ```

    default-src 'self';

    script-src 'self' 'nonce-<random>' 'strict-dynamic';

    style-src 'self' 'nonce-<random>';

    style-src-attr 'unsafe-inline';

    img-src 'self' data: blob:;

    media-src 'self' blob:;

    font-src 'self' data:;

    connect-src 'self';

    worker-src 'self' blob:;

    frame-ancestors 'self';

    base-uri 'self';

    form-action 'self';

    object-src 'none';

    upgrade-insecure-requests

    ```


    **VAPT validation checklist for CSP:**


    - The browser MUST receive exactly **one** `Content-Security-Policy`
      header (not two — duplicate headers would intersect and drop the
      nonce; this was a deployment regression fixed by per-location nginx
      header override).
    - Two consecutive requests MUST return **different** nonce values.

    - `'unsafe-inline'` MUST NOT appear in `script-src` (only nonce + strict-dynamic).

    - `'unsafe-eval'` MUST NOT appear anywhere.

    - `style-src-attr 'unsafe-inline'` is intentional and accepted: it permits
      inline `style="…"` attributes only (not `<style>` tags). The risk
      profile is materially lower than `script-src 'unsafe-inline'`.

    ## Known pen-test focus areas


    - `/api/media?key=...` is unauthenticated — key enumeration can expose any
      stored blob. Range-request handling is delegated to the Azure SDK.
    - `/api/upload/file` is excluded from the middleware matcher (bypasses the
      10 MB edge-buffer cap). It authenticates itself internally.
    - Rate limiting is **not wired up** on any route (the module exists but is
      unused) — test for enumeration, credential stuffing, semantic-search DoS.
    - JWT revocation is in-memory and not distributed (multi-instance gap).

    - CSRF relies on `SameSite=Lax` + cookie auth; there are no explicit CSRF
      tokens on custom API routes.
    - The Credentials provider (email + password) is disabled in production —
      only Microsoft Entra ID (Azure AD) SSO is accepted. Verify by attempting
      `POST /api/auth/callback/credentials` against UAT/prod (must reject).
    - `/api/admin/blob-sweep?dry-run=false` performs destructive Azure deletions.
      Restricted to `superadmin`; verify role enforcement and audit-log emission.
    - `/api/auth/[...nextauth]/signout` revokes the current JWT's `jti` only in
      the local Node process — a parallel pm2 worker may still accept the token
      until its TTL expires.

    ## Changelog


    - **0.2.1** (2026-05-20) — Refresh for VAPT delivery. No production API
      surface changes since 0.2.0; verified all 26 route handlers under
      `app/api/**` against this spec. Commit `f271a98` (2026-05-16) relaxes
      CSP **in development only** to unblock HMR — the production CSP
      contract documented above is unchanged.
    - **0.2.0** (2026-04-30) — Document response security headers (CSP nonce,
      HSTS, X-Frame-Options, etc.) added in commit `f1ad4dd`. Add reusable
      `components.headers` definitions. Document `/api/admin/blob-sweep`
      destructive-mode safeguards and the streaming `/api/media` proxy.
    - **0.1.0** (2026-04-22) — Initial machine-readable contract for VAPT.
  contact:
    name: Audit Brief Platform Team
  license:
    name: Proprietary — internal use only
servers:
  - url: https://uat.uno.wcgt.in/auditbrief
    description: UAT / production-equivalent (basePath `/auditbrief`).
security:
  - cookieAuth: []
tags:
  - name: Health
    description: Liveness and readiness probes. Unauthenticated.
  - name: Auth
    description: Registration and the NextAuth sign-in / sign-out / session / CSRF flow.
  - name: Audit Briefs
    description: CRUD and soft/hard delete for audit brief content.
  - name: Transcripts
    description: Transcript retrieval and upsert (with pgvector embedding regeneration).
  - name: Bookmarks
    description: Per-user bookmarks on audit briefs and learning-path episodes.
  - name: Favorites
    description: Per-user favorited audit briefs.
  - name: Learning Graphs
    description: Linear or graph-shaped learning paths composed of episodes.
  - name: Learning Graph Favorites
    description: Per-user favorited learning graphs.
  - name: Progress
    description: Episode-level completion tracking per user.
  - name: Activity
    description: Fire-and-forget user activity logging for analytics.
  - name: Search
    description: Keyword and semantic search over audit briefs and transcripts.
  - name: Users
    description: User administration (superadmin only).
  - name: Admin
    description: Analytics dashboards and infrastructure maintenance (admin+).
  - name: Upload
    description: Presigned-URL and direct multipart file uploads to Azure Blob Storage.
  - name: Media
    description: Range-request streaming of stored blobs.
paths:
  /api/health:
    get:
      tags:
        - Health
      operationId: getHealth
      summary: Liveness probe
      description: |
        Returns `200` as long as the Node.js process is alive. Does **not** check
        downstream dependencies — use `/api/ready` for that.
      security: []
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - timestamp
                  - version
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                    example: ok
                  timestamp:
                    type: string
                    format: date-time
                    example: '2026-04-22T09:15:00Z'
                  version:
                    type: string
                    example: 0.1.0
        '500':
          $ref: '#/components/responses/InternalError'
  /api/ready:
    get:
      tags:
        - Health
      operationId: getReady
      summary: Readiness probe (database check)
      description: |
        Runs a `SELECT 1` against PostgreSQL. Returns `200` when the database is
        reachable, `503` otherwise. Load balancers and orchestrators should stop
        routing traffic (but not restart the container) on `503`.
      security: []
      responses:
        '200':
          description: Application is ready to serve traffic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
              example:
                status: ready
                timestamp: '2026-04-22T09:15:00Z'
                checks:
                  database: ok
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: Database unreachable — not ready to serve traffic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
              example:
                status: not_ready
                timestamp: '2026-04-22T09:15:00Z'
                checks:
                  database: failed
  /api/auth/{nextauth}:
    parameters:
      - in: path
        name: nextauth
        required: true
        description: |
          NextAuth v4 catch-all. Valid sub-paths:
            - `signin`              — GET: sign-in page, POST: begin sign-in flow
            - `signin/credentials`  — POST: submit email+password (dev only)
            - `signin/azure-ad`     — GET: kick off Azure AD OAuth
            - `callback/credentials`— POST: NextAuth credentials callback
            - `callback/azure-ad`   — GET: Azure AD OAuth return URL
            - `signout`             — POST: invalidate session (adds `jti` to revocation list)
            - `session`             — GET: current session `{ user, expires }`
            - `csrf`                — GET: CSRF token for form-based POSTs
            - `providers`           — GET: enabled providers

          All sub-paths are handled by the NextAuth v4 framework — see
          https://next-auth.js.org/configuration/initialization for the full
          request/response contract.
        schema:
          type: string
          example: session
    get:
      tags:
        - Auth
      operationId: nextAuthGet
      summary: NextAuth catch-all (GET)
      description: |
        Framework-handled NextAuth endpoint. Shape of the response depends on
        the sub-path. See the `nextauth` path parameter for sub-path reference.
      security: []
      responses:
        '200':
          description: Handler-specific success payload.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/NextAuthSession'
                  - $ref: '#/components/schemas/NextAuthCsrfToken'
                  - $ref: '#/components/schemas/NextAuthProviders'
                  - type: object
                    description: Free-form response for signin pages and other handlers.
        '302':
          description: Redirect to provider, callback, or post-login URL.
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - Auth
      operationId: nextAuthPost
      summary: NextAuth catch-all (POST)
      description: |
        Framework-handled NextAuth endpoint. Used for credential sign-in,
        sign-out, and OAuth callbacks. Bodies are `application/x-www-form-urlencoded`
        (NextAuth default) with fields that vary per sub-path.
      security: []
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              description: Sub-path-specific fields (e.g. `email`, `password`, `csrfToken`, `callbackUrl`).
              additionalProperties: true
      responses:
        '200':
          description: Sign-in/sign-out result.
        '302':
          description: Redirect after successful flow.
        '401':
          description: Credentials rejected.
  /api/auth/register:
    post:
      tags:
        - Auth
      operationId: registerUser
      summary: Register a new local user
      description: |
        Creates a user record with a bcrypt-hashed password (cost 12) and default
        role `public`. The client is responsible for signing in via NextAuth
        after a successful registration — this endpoint does **not** set a
        session cookie. Disabled in production when the credentials provider is
        turned off.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              email: newuser@example.com
              password: Str0ng!Pass1234
              displayName: Jane Doe
      responses:
        '201':
          description: User created.
          content:
            application/json:
              schema:
                type: object
                required:
                  - user
                properties:
                  user:
                    $ref: '#/components/schemas/RegisteredUser'
              example:
                user:
                  id: 3f2e7a6d-4b1a-4f9d-8a77-1b4c8e6d2a10
                  email: newuser@example.com
                  displayName: Jane Doe
                  role: public
                  createdAt: '2026-04-22T09:15:00Z'
        '400':
          description: Duplicate email (`A user with this email already exists`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/audit-briefs:
    get:
      tags:
        - Audit Briefs
      operationId: listAuditBriefs
      summary: List non-archived audit briefs
      description: Public. Supports domain / year / tag filters and pagination.
      security: []
      parameters:
        - in: query
          name: domain
          schema:
            $ref: '#/components/schemas/Domain'
          description: Filter by knowledge domain.
        - in: query
          name: year
          schema:
            type: integer
            minimum: 2020
            maximum: 2099
          description: Filter by publication year.
        - in: query
          name: tags
          schema:
            type: string
          description: Comma-separated list — matches briefs containing **any** of these tags.
          example: ISA-240,fraud
        - in: query
          name: sort
          schema:
            type: string
            enum:
              - newest
              - oldest
              - title
            default: newest
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Paginated list of audit briefs.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AuditBrief'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - Audit Briefs
      operationId: createAuditBrief
      summary: Create an audit brief
      description: Requires role `admin` or `superadmin`. Writes an audit-log row and revalidates public caches.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAuditBriefRequest'
      responses:
        '201':
          description: Audit brief created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AuditBrief'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/audit-briefs/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
    get:
      tags:
        - Audit Briefs
      operationId: getAuditBrief
      summary: Get a single audit brief (with transcripts)
      description: Public. Returns the non-archived audit brief and all associated transcripts.
      security: []
      responses:
        '200':
          description: Audit brief with transcripts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AuditBriefWithTranscripts'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags:
        - Audit Briefs
      operationId: updateAuditBrief
      summary: Update an audit brief
      description: |
        Requires role `admin` or `superadmin`. Optional-opt-in optimistic
        concurrency: supplying `expectedUpdatedAt` causes the server to compare
        with the stored `updatedAt` and respond `409 CONFLICT` when the client
        view is stale. Replaced blob URLs are purged from Azure after the
        update commits; an audit-log row is written; public caches are revalidated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAuditBriefRequest'
      responses:
        '200':
          description: Updated audit brief.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AuditBrief'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - Audit Briefs
      operationId: deleteAuditBrief
      summary: Soft-archive (default) or hard-delete an audit brief
      description: |
        Requires role `admin` or `superadmin`.

        - **Soft archive** (default): flips `isArchived=true`. Blobs stay intact.
          Reversible via PUT with `isArchived: false`.
        - **Hard delete**: `?hard=true` with body `{"confirm":"DELETE"}`.
          Cascades to transcripts, bookmarks, favorites; nulls the
          `auditBriefId` on activity rows; purges every referenced blob. Not reversible.
      parameters:
        - in: query
          name: hard
          required: false
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
          description: Set to `true` for permanent deletion. Requires confirmation body.
      requestBody:
        required: false
        description: Required only when `?hard=true`.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HardDeleteConfirmRequest'
      responses:
        '200':
          description: Archive/delete succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        enum:
                          - Audit brief archived successfully
                          - Audit brief permanently deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/audit-briefs/{id}/transcript:
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
    get:
      tags:
        - Transcripts
      operationId: listTranscriptsForBrief
      summary: List transcripts for an audit brief
      description: Public. Returns all transcripts (short and/or long) attached to the brief.
      security: []
      responses:
        '200':
          description: Array of transcripts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Transcript'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags:
        - Transcripts
      operationId: upsertTranscript
      summary: Upsert a transcript and regenerate its embedding
      description: |
        Requires role `admin` or `superadmin`. Uses the unique constraint
        `[auditBriefId, transcriptType]` to upsert. After commit, the pgvector
        embedding is regenerated from the new `fullText` via Azure OpenAI — a
        failure there is logged at `warn` but does **not** fail the mutation,
        so semantic search may be stale until the next successful regeneration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertTranscriptRequest'
      responses:
        '200':
          description: Upserted transcript.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Transcript'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/audit-briefs/batch:
    patch:
      tags:
        - Audit Briefs
      operationId: batchUpdateAuditBriefSortOrder
      summary: Batch-update audit brief sort orders
      description: |
        Requires role `admin` or `superadmin`. Runs all updates inside a single
        database transaction. The entire array is applied atomically; a single
        invalid row rejects the whole batch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchUpdateSortOrderRequest'
            example:
              - id: 3f2e7a6d-4b1a-4f9d-8a77-1b4c8e6d2a10
                sortOrder: 0
              - id: c8a9f201-7d2e-4b3c-9f14-2a8b6d7e9c05
                sortOrder: 1
      responses:
        '200':
          description: Batch applied.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Sort orders updated successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/bookmarks:
    get:
      tags:
        - Bookmarks
      operationId: listBookmarks
      summary: List the caller's bookmarks
      description: Authenticated. Can filter by `auditBriefId` or `episodeId`.
      parameters:
        - in: query
          name: auditBriefId
          schema:
            type: string
            format: uuid
          description: Return only bookmarks on this audit brief.
        - in: query
          name: episodeId
          schema:
            type: string
            format: uuid
          description: Return only bookmarks on this learning-path episode.
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Paginated bookmarks for the caller.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Bookmark'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - Bookmarks
      operationId: createBookmark
      summary: Create a bookmark
      description: |
        Authenticated. Exactly one of `auditBriefId` or `episodeId` must be
        supplied. The referenced parent must exist, otherwise `400`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookmarkRequest'
      responses:
        '201':
          description: Bookmark created.
          content:
            application/json:
              schema:
                type: object
                properties:
