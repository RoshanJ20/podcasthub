  /api/activity:
    post:
      tags:
        - Activity
      operationId: logActivity
      summary: Log a user activity event (fire-and-forget)
      description: |
        Authenticated. Records a single `UserActivity` row. The response body
        is `null` — the client fires-and-forgets. This feeds `/api/admin/analytics`.

        Note: `auditBriefId` / `episodeId` / `graphId` are accepted as free
        strings (not validated as UUIDs at the schema level); the server will
        null them out at persistence time rather than reject.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityEventRequest'
            example:
              activityType: listen
              auditBriefId: 3f2e7a6d-4b1a-4f9d-8a77-1b4c8e6d2a10
              metadata:
                seconds: 42
      responses:
        '201':
          description: |
            Activity recorded. Response body is the JSON literal `null`
            (OpenAPI 3.0.3 has no `null` type, so no body schema is declared).
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/search:
    get:
      tags:
        - Search
      operationId: keywordSearch
      summary: Keyword search over audit briefs
      description: |
        Public. Case-insensitive `contains` match on title / description / tags
        across non-archived audit briefs. Response is **not** wrapped in `data`.
      security: []
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
            minLength: 1
          example: revenue recognition
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Search hits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeywordSearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - Search
      operationId: semanticSearch
      summary: Semantic (pgvector) search over transcript text
      description: |
        Public. Generates an Azure OpenAI embedding for `query`, runs a cosine
        similarity search over `transcripts.embedding`, and returns the top 10
        results with similarity > 0.7. Response is **not** wrapped in `data`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - query
              properties:
                query:
                  type: string
                  minLength: 1
            example:
              query: how do we handle going-concern uncertainty?
      responses:
        '200':
          description: Semantic search hits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SemanticSearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/users:
