        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/learning-graphs/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
    get:
      tags:
        - Learning Graphs
      operationId: getLearningGraph
      summary: Get a learning graph (with episodes + edges)
      description: Public.
      security: []
      responses:
        '200':
          description: Learning graph with episodes and edges.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/LearningGraphWithData'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags:
        - Learning Graphs
      operationId: updateLearningGraph
      summary: Update a learning graph
      description: |
        Requires role `admin` or `superadmin`. Supports optional-opt-in
        optimistic concurrency via `expectedUpdatedAt` — returns `409` when the
        client's view is stale. Writes an audit-log row and revalidates public caches.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLearningGraphRequest'
      responses:
        '200':
          description: Updated learning graph.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/LearningGraph'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - Learning Graphs
      operationId: deleteLearningGraph
      summary: Hard-delete a learning graph (with confirmation body)
      description: |
        Requires role `admin` or `superadmin`. Always hard-deletes — learning
        graphs have no soft-archive mode. Body **must** contain
        `{"confirm":"DELETE"}` to prevent a bare DELETE from succeeding.
        Cascades to episodes, edges, favorites, progress, bookmarks; purges all
        referenced blobs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HardDeleteConfirmRequest'
      responses:
        '200':
          description: Learning graph permanently deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: Learning graph permanently deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/learning-graphs/{id}/data:
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
    put:
      tags:
        - Learning Graphs
      operationId: upsertLearningGraphData
      summary: Bulk upsert episodes and edges for a learning graph
      description: |
        Requires role `admin` or `superadmin`.

        Upsert semantics preserve episode IDs across saves (protecting referencing
        `UserProgress` and `UserActivity` rows from cascade deletion):

        - Episodes whose `id` matches an existing row are **updated in place**.
        - Episodes whose `id` starts with `temp-` (or is missing) are **created** and
          the temp ID is returned so the client can reconcile.
        - Episodes present in the database but absent from the payload are **deleted**,
          along with any edges that referenced them; their blobs are purged.
        - Edges are replaced wholesale — all old edges deleted, new ones created
          with temp IDs resolved.

        Revalidates the public learning-graph caches.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertGraphDataRequest'
      responses:
        '200':
          description: Full saved graph with episodes (sorted) and edges.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/LearningGraphWithData'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/learning-graph-favorites:
