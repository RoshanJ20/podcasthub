                description: Existing UUID or client temp ID.
              targetEpisodeId:
                type: string
                description: Existing UUID or client temp ID.
              label:
                type: string
                nullable: true
    ProgressCreateRequest:
      type: object
      required:
        - graphId
        - episodeId
      properties:
        graphId:
          type: string
          minLength: 1
        episodeId:
          type: string
          minLength: 1
    UserProgress:
      type: object
      required:
        - id
        - userId
        - graphId
        - episodeId
        - completedAt
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        graphId:
          type: string
          format: uuid
        episodeId:
          type: string
          format: uuid
        completedAt:
          type: string
          format: date-time
    ProgressRecord:
      allOf:
        - $ref: '#/components/schemas/UserProgress'
        - type: object
          properties:
            graph:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                title:
                  type: string
            episode:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                title:
                  type: string
    ActivityEventRequest:
      type: object
      required:
        - activityType
      properties:
        activityType:
          $ref: '#/components/schemas/ActivityType'
        auditBriefId:
          type: string
          description: Not UUID-validated at schema level.
        episodeId:
          type: string
        graphId:
          type: string
        metadata:
          type: object
          description: Free-form structured payload (e.g. playback position, search query).
          additionalProperties: true
    HardDeleteConfirmRequest:
      type: object
      required:
        - confirm
      properties:
        confirm:
          type: string
          enum:
            - DELETE
          description: Must be the literal string `DELETE`.
    KeywordSearchResponse:
      type: object
      required:
        - results
        - query
        - total
        - page
        - limit
      properties:
        query:
          type: string
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        results:
          type: array
          items:
            type: object
            required:
              - id
              - title
              - domain
            properties:
              id:
                type: string
                format: uuid
              title:
                type: string
              description:
                type: string
              domain:
                $ref: '#/components/schemas/Domain'
              tags:
                type: array
                items:
                  type: string
              thumbnailUrl:
                type: string
    SemanticSearchResponse:
      type: object
      required:
        - results
        - query
      properties:
        query:
          type: string
        results:
          type: array
          description: Top 10 transcript hits with similarity > 0.7, ordered by similarity desc.
          items:
            type: object
            required:
              - id
              - auditBriefId
              - auditBriefTitle
              - content
              - similarity
            properties:
              id:
                type: string
                format: uuid
                description: Transcript ID.
              auditBriefId:
                type: string
                format: uuid
              auditBriefTitle:
                type: string
              content:
                type: string
                description: Currently the full transcript text.
              startTime:
                type: number
                description: Reserved for future segment-level scoring. Always 0.
              endTime:
                type: number
                description: Reserved for future segment-level scoring. Always 0.
              similarity:
                type: number
                description: Cosine similarity in [0, 1].
    UserListEntry:
      type: object
      required:
        - id
        - email
        - role
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
          description: '`displayName` re-keyed as `name` for this list endpoint.'
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
        createdAt:
          type: string
          format: date-time
    UserRoleUpdateRequest:
      type: object
      required:
        - role
      properties:
        role:
          $ref: '#/components/schemas/Role'
    UserRoleUpdateResponse:
      type: object
      required:
        - id
        - email
        - role
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
          description: '`displayName` re-keyed as `name`.'
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
    AdminAnalytics:
      type: object
      required:
        - totalAuditBriefs
        - totalPaths
        - totalListens
        - uniqueListeners
        - listensByDomain
        - monthlyTrends
        - topTopics
      properties:
        totalAuditBriefs:
          type: integer
          description: Count of non-archived audit briefs (optionally date-filtered).
        totalPaths:
          type: integer
          description: Count of published learning graphs.
        totalListens:
          type: integer
          description: Count of `listen` activity rows.
        uniqueListeners:
          type: integer
          description: Distinct userIds with `listen` activity.
        listensByDomain:
          type: array
          items:
            type: object
            required:
              - domain
              - count
            properties:
              domain:
                type: string
                description: '`Unknown` when the audit brief was hard-deleted.'
              count:
                type: integer
        monthlyTrends:
          type: array
          description: Calendar-month aggregates, chronologically sorted.
          items:
            type: object
            required:
              - month
              - count
            properties:
              month:
                type: string
                example: 2026-04
              count:
                type: integer
        topTopics:
          type: array
          description: Top 10 audit briefs by listen count (resolved to titles).
          items:
            type: object
            required:
              - topic
              - count
            properties:
              topic:
                type: string
              count:
                type: integer
    BlobSweepResult:
      type: object
      required:
        - dryRun
        - totalBlobs
        - referencedBlobs
        - orphanedCount
        - deletedCount
        - failedCount
        - orphanedKeys
      properties:
        dryRun:
          type: boolean
        totalBlobs:
          type: integer
        referencedBlobs:
          type: integer
        orphanedCount:
          type: integer
        deletedCount:
          type: integer
          description: Zero in dry-run mode.
        failedCount:
          type: integer
        orphanedKeys:
          type: array
          items:
            type: string
          example:
            - audio/old-uuid/leaked-audio.mp3
    PresignedUploadRequest:
      type: object
      required:
        - filename
        - content_type
        - file_size
        - category
      properties:
        filename:
          type: string
          minLength: 1
        content_type:
          type: string
          minLength: 1
          description: Must be allowed for `category`.
        file_size:
          type: integer
          minimum: 1
          description: Bytes. Must not exceed the per-category max (audio 500 MB, image 5 MB, pdf 50 MB).
        category:
          $ref: '#/components/schemas/UploadCategory'
    PresignedUploadResponse:
      type: object
      required:
        - upload_url
        - key
        - container
      properties:
        upload_url:
          type: string
          format: uri
          description: Short-lived (1 hour) write-only SAS URL for a direct PUT from the client.
        key:
          type: string
          description: Generated blob key `{category}/{uuid}/{sanitized-filename}`.
        container:
          type: string
          description: Azure Blob Storage container name (e.g. `the-audit-brief-uploads`).
    DirectUploadFormData:
      type: object
      required:
        - file
        - category
      properties:
        file:
          type: string
          format: binary
          description: The file bytes. MIME type is validated against the category.
        category:
          $ref: '#/components/schemas/UploadCategory'
