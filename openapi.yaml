  /api/favorites:
    get:
      tags:
        - Favorites
      operationId: listFavoriteAuditBriefs
      summary: List favorited audit brief IDs
      description: |
        Authenticated. Returns a **flat** array of audit brief IDs (not
        paginated) because a user's favorites list is expected to remain small
        and is loaded once on the client for UI state hydration.
      responses:
        '200':
          description: Array of audit brief IDs favorited by the caller.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: string
                      format: uuid
                    example:
                      - 3f2e7a6d-4b1a-4f9d-8a77-1b4c8e6d2a10
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - Favorites
      operationId: toggleFavoriteAuditBrief
      summary: Toggle favorite on an audit brief (idempotent)
      description: |
        Authenticated. Idempotent toggle: creates the favorite (responds `201`,
        `{favorited:true}`) if it does not exist; deletes it (responds `200`,
        `{favorited:false}`) if it does. Races on concurrent toggles are
        swallowed (P2002/P2025) and treated as the desired end-state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FavoriteAuditBriefToggleRequest'
      responses:
        '200':
          description: Favorite removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteToggleResponse'
              example:
                data:
                  favorited: false
        '201':
          description: Favorite created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteToggleResponse'
              example:
                data:
                  favorited: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/learning-graphs:
