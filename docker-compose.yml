services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: podcasthub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: podcasthub
      POSTGRES_PASSWORD: podcasthub_dev
      POSTGRES_DB: podcasthub
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: podcasthub-azurite
    restart: unless-stopped
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --skipApiVersionCheck
    ports:
      - '10000:10000'
    volumes:
      - azurite_data:/data

volumes:
  postgres_data:
  azurite_data:
